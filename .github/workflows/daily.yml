name: Daily Overviews

on:
  schedule:
    - cron: "10 10 * * *"   # daily 10:10 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-overviews
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topic:
          - topic-01
          - topic-02
          - topic-03
          - topic-04
          - topic-05
          - topic-06
          - topic-07
          - topic-08
          - topic-09
          - topic-10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests feedparser python-dateutil

      - name: Run topic pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC_ID: ${{ matrix.topic }}
        run: |
          python scripts/run_topic.py

      - name: Commit feeds/state
        run: |
          git config user.name "agenda-bot"
          git config user.email "bot@github.com"
          git add feeds/ data/
          git commit -m "chore: daily update (${{ matrix.topic }})" || echo "No changes"
          git push
