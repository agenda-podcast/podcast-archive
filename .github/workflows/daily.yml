name: Daily Overviews (10 topics)

on:
  schedule:
    - cron: "10 6 * * *"   # daily 06:10 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-overviews
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topic:
          - topic-01
          #- topic-02
          #- topic-03
          #- topic-04
          #- topic-05
          #- topic-06
          #- topic-07
          #- topic-08
          #- topic-09
          #- topic-10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install system deps (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser python-dateutil

      # IMPORTANT: Google GenAI official SDK (Gemini)
      - name: Install Gemini SDK
        run: |
          pip install google-genai

      - name: Run topic pipeline
        env:
          TOPIC_ID: ${{ matrix.topic }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-2.5-flash-preview-tts
          VOICE_A: Kore
          VOICE_B: Puck
          TTS_MAX_CHARS_PER_CHUNK: "3200"
          TTS_TURN_GAP_MS: "200"

          # Apple requires owner email in RSS
          PODCAST_OWNER_NAME: "Agenda"
          PODCAST_OWNER_EMAIL: "deep.dive.podcast@unloca.com"

          # Release tag per topic => stable download URLs
          RELEASE_TAG: ${{ matrix.topic }}

        run: |
          python scripts/run_topic.py

      - name: Commit feeds + data changes
        run: |
          git config user.name "agenda-bot"
          git config user.email "bot@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add feeds data
            git commit -m "chore: update feeds/data (${{ matrix.topic }})" || true
            git push
          else
            echo "No changes to commit"
          fi
