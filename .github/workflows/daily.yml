name: Daily Overviews (Option A – single writer)

on:
  schedule:
    - cron: "10 6 * * *"   # daily 06:10 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-overviews
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # 1) COLLECT SOURCES (NO PUSH)
  # ------------------------------------------------------------
  collect:
    name: Collect sources (all topics)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser python-dateutil

      - name: Collect sources
        run: |
          python scripts/collect_sources.py

      - name: Upload collected data
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: data

  # ------------------------------------------------------------
  # 2) VOICES (PIPER MODELS) – NO PUSH
  # ------------------------------------------------------------
  voices:
    name: Ensure TTS voices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Piper
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts

      - name: Download / update voices
        run: |
          python scripts/ensure_voices.py

      - name: Upload voices
        uses: actions/upload-artifact@v4
        with:
          name: voices-assets
          path: assets/piper

  # ------------------------------------------------------------
  # 3) RUN TOPIC PIPELINE (NO PUSH)
  # ------------------------------------------------------------
  run:
    name: Run topic pipeline
    needs: [collect, voices]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        topic:
          - topic-01
          # - topic-02
          # ...

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download collected data
        uses: actions/download-artifact@v4
        with:
          name: collected-data
          path: data

      - name: Download voices
        uses: actions/download-artifact@v4
        with:
          name: voices-assets
          path: assets/piper

      - name: Setup ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser python-dateutil

      - name: Gate by fresh.json
        id: gate
        env:
          FRESH: data/${{ matrix.topic }}/fresh.json
        run: |
          set -e

          if [ ! -f "$FRESH" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          COUNT=$(python -c "import json; d=json.load(open('$FRESH')); print(len(d) if isinstance(d,list) else 0)")

          echo "fresh_count=$COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Run topic
        if: steps.gate.outputs.should_run == 'true'
        env:
          TOPIC_ID: ${{ matrix.topic }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          PODCAST_OWNER_NAME: "Agenda"
          PODCAST_OWNER_EMAIL: "deep.dive.podcast@unloca.com"
          RELEASE_TAG: ${{ matrix.topic }}

        run: |
          python scripts/run_topic.py

      - name: Upload outputs
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ matrix.topic }}
          path: |
            outputs
            feed
            data

  # ------------------------------------------------------------
  # 4) FINALIZE (SINGLE WRITER, SINGLE PUSH)
  # ------------------------------------------------------------
  finalize:
    name: Finalize & push
    needs: [collect, voices, run]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (fresh)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download collected data
        uses: actions/download-artifact@v4
        with:
          name: collected-data
          path: data

      - name: Download voices
        uses: actions/download-artifact@v4
        with:
          name: voices-assets
          path: assets/piper

      - name: Download outputs (all topics)
        uses: actions/download-artifact@v4
        with:
          pattern: outputs-*
          merge-multiple: true
          path: .

      - name: Commit & push (single writer)
        run: |
          git config user.name "agenda-bot"
          git config user.email "bot@github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add data assets feed outputs
            git commit -m "chore: daily overviews"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nothing to commit"
          fi
