name: "Daily Overviews"

on:
  schedule:
    - cron: "10 6 * * *" # daily 06:10 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "daily-overviews"
  cancel-in-progress: true

jobs:
  collect:
    name: "Collect sources (all topics)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install deps"
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser python-dateutil

      - name: "Collect sources"
        run: |
          python scripts/collect_sources.py

      - name: "Upload collected data"
        uses: actions/upload-artifact@v4
        with:
          name: "collected-data"
          path: "data"
          if-no-files-found: error

  voices:
    name: "Ensure TTS voices"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install Piper"
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts

      - name: "Download / update voices"
        env:
          PIPER_MODEL_DIR: "assets/piper"
          PIPER_VOICES: "en_US-ryan-medium,en_US-amy-medium"
        run: |
          python scripts/ensure_voices.py

      - name: "Upload voices"
        uses: actions/upload-artifact@v4
        with:
          name: "voices-assets"
          path: "assets/piper"
          if-no-files-found: error

  run:
    name: "Run topic pipeline"
    needs: [collect, voices]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        topic:
          - "topic-01"
          # - "topic-02"
          # - "topic-03"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Download collected data"
        uses: actions/download-artifact@v4
        with:
          name: "collected-data"
          path: "data"

      - name: "Download voices"
        uses: actions/download-artifact@v4
        with:
          name: "voices-assets"
          path: "assets/piper"

      - name: "Setup ffmpeg"
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install deps (runtime)"
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser python-dateutil

      - name: "Gate by fresh.json"
        id: gate
        env:
          FRESH: "data/${{ matrix.topic }}/fresh.json"
        run: |
          set -euo pipefail

          if [ ! -f "$FRESH" ]; then
            echo "Fresh file missing: $FRESH"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json, os
          p = os.environ["FRESH"]
          try:
              data = json.load(open(p, "r", encoding="utf-8"))
              ok = isinstance(data, list) and len(data) > 0
              count = (len(data) if isinstance(data, list) else 0)
          except Exception:
              ok = False
              count = 0
          print("fresh_ok=", ok)
          print("fresh_count=", count)
          PY

          COUNT=$(python - <<'PY'
          import json, os
          p = os.environ["FRESH"]
          try:
              d = json.load(open(p, "r", encoding="utf-8"))
              print(len(d) if isinstance(d, list) else 0)
          except Exception:
              print(0)
          PY
          )

          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Run topic"
        if: steps.gate.outputs.should_run == 'true'
        env:
          TOPIC_ID: "${{ matrix.topic }}"
          REPO: "${{ github.repository }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"

          # Piper location
          PIPER_MODEL_DIR: "assets/piper"
          PIPER_VOICE_A: "en_US-ryan-medium"
          PIPER_VOICE_B: "en_US-amy-medium"

          # Script model (Gemini is for script even if premium_tts=false)
          GEMINI_SCRIPT_MODEL: "gemini-2.0-flash"

          # Podcast metadata
          PODCAST_OWNER_NAME: "Agenda"
          PODCAST_OWNER_EMAIL: "deep.dive.podcast@unloca.com"

          RELEASE_TAG: "${{ matrix.topic }}"
        run: |
          python scripts/run_topic.py

      - name: "Upload outputs"
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "outputs-${{ matrix.topic }}"
          path: |
            outputs
            feed
            data
          if-no-files-found: warn

  finalize:
    name: "Finalize and push"
    needs: [collect, voices, run]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout (fresh)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "Prepare artifacts dir"
        run: |
          mkdir -p _artifacts/collected-data
          mkdir -p _artifacts/voices-assets
          mkdir -p _artifacts/outputs

      - name: "Download collected data"
        uses: actions/download-artifact@v4
        with:
          name: "collected-data"
          path: "_artifacts/collected-data"

      - name: "Download voices"
        uses: actions/download-artifact@v4
        with:
          name: "voices-assets"
          path: "_artifacts/voices-assets"

      - name: "Download outputs (all topics)"
        uses: actions/download-artifact@v4
        with:
          pattern: "outputs-*"
          merge-multiple: true
          path: "_artifacts/outputs"

      - name: "Sync to origin/main first"
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: "Apply artifacts into working tree"
        run: |
          set -euo pipefail

          rsync -a --delete _artifacts/collected-data/ data/

          mkdir -p assets/piper
          rsync -a --delete _artifacts/voices-assets/ assets/piper/

          if [ -d "_artifacts/outputs/data" ]; then
            rsync -a _artifacts/outputs/data/ data/
          fi
          if [ -d "_artifacts/outputs/feed" ]; then
            mkdir -p feed
            rsync -a _artifacts/outputs/feed/ feed/
          fi
          if [ -d "_artifacts/outputs/outputs" ]; then
            mkdir -p outputs
            rsync -a _artifacts/outputs/outputs/ outputs/
          fi

      - name: "Commit and push (single writer, retry-safe)"
        run: |
          set -euo pipefail

          git config user.name "agenda-bot"
          git config user.email "bot@github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add data assets feed outputs
            git commit -m "chore: daily overviews"

            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                echo "Push succeeded."
                exit 0
              fi
              echo "Push failed, retry $i/5..."
              git fetch origin main
              git rebase origin/main
              sleep $((i*5))
            done

            git push origin HEAD:main
          else
            echo "Nothing to commit"
          fi
