name: "Daily Overviews"

on:
  schedule:
    - cron: "10 6 * * *" # daily 06:10 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "daily-overviews"
  cancel-in-progress: true

jobs:
  collect:
    name: "Collect sources (all topics)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install deps"
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser python-dateutil

      - name: "Collect sources"
        run: |
          # run as module so package imports work reliably
          python -m scripts.collect_sources

      - name: "Upload collected data"
        uses: actions/upload-artifact@v4
        with:
          name: "collected-data"
          path: "data"
          if-no-files-found: error

  voices:
    name: "Ensure TTS voices"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install Piper (python package for voice utilities)"
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts

      - name: "Download / update voices"
        env:
          PIPER_MODEL_DIR: "assets/piper"
          PIPER_VOICES: "en_US-ryan-medium,en_US-amy-medium"
        run: |
          python -m scripts.ensure_voices

      - name: "Upload voices"
        uses: actions/upload-artifact@v4
        with:
          name: "voices-assets"
          path: "assets/piper"
          if-no-files-found: error

  run:
    name: "Run topic pipeline"
    needs: [collect, voices]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        topic:
          - "topic-01"
          # - "topic-02"
          # - "topic-03"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Download collected data"
        uses: actions/download-artifact@v4
        with:
          name: "collected-data"
          path: "data"

      - name: "Download voices"
        uses: actions/download-artifact@v4
        with:
          name: "voices-assets"
          path: "assets/piper"

      - name: "Setup ffmpeg"
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install deps (runtime)"
        run: |
          python -m pip install --upgrade pip
          # prefer repository requirements if present, else install common runtime deps
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests feedparser python-dateutil piper-tts
          fi

      - name: "Install piper binary"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # attempt to install the standalone piper binary used by scripts/tts_generate.py
          if [ -f .github/scripts/install_piper.py ]; then
            python .github/scripts/install_piper.py
          else
            echo "Warning: .github/scripts/install_piper.py not found; ensure piper binary is available in tools/"
          fi
          echo "PIPER_BINARY=./tools/piper" >> $GITHUB_ENV

      - name: "Debug - environment & repo"
        env:
          PYTHONUNBUFFERED: 1
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== python version ==="
          python --version
          echo "=== ls -la repo root ==="
          ls -la
          echo "=== ls -R scripts ==="
          ls -la scripts || true
          echo "=== Show assets/piper ==="
          ls -la assets/piper || true
          echo "=== Show tools ==="
          ls -la tools || true
          echo "=== env vars (filtered) ==="
          env | grep -E 'PIPER|PYTHON|GITHUB' || true

      - name: "Run topic pipeline (module mode)"
        env:
          PYTHONUNBUFFERED: 1
          PIPER_BINARY: ${{ env.PIPER_BINARY }}
          TOPIC: ${{ matrix.topic }}
          TOPIC_ID: ${{ matrix.topic }}
        run: |
          set -o pipefail
          mkdir -p logs
          # run as module so package imports (from scripts.*) resolve correctly
          echo "Running topic pipeline for topic='${TOPIC}'"
          python -m scripts.run_topic "${TOPIC}" 2>&1 | tee "logs/run_topic_${TOPIC}.log"
          rc=${PIPESTATUS[0]}
          echo "run_topic exited with code ${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "ERROR: scripts.run_topic failed with exit code ${rc}"
            exit ${rc}
          fi

      - name: "Verify generated audio / video files"
        run: |
          set -euo pipefail
          echo "Searching for generated audio/video files..."
          find . -type f \( -iname "*.mp3" -o -iname "*.wav" -o -iname "*.m4a" -o -iname "*.aac" -o -iname "*.flac" -o -iname "*.ogg" -o -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.mov" \) -print > logs/generated_files.txt || true
          wc -l logs/generated_files.txt || true
          if [ ! -s logs/generated_files.txt ]; then
            echo "ERROR: No audio or video files were generated."
            echo "=== Logs (head) ==="
            head -n 200 logs/run_topic_${{ matrix.topic }}.log || true
            # fail the job so missing outputs are visible
            exit 2
          else
            echo "Generated files:"
            sed -n '1,200p' logs/generated_files.txt
          fi

      - name: "Upload artifacts: generated outputs + logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "daily-overview-output-${{ matrix.topic }}"
          path: |
            logs
            assets
            tools
            ./**/logs/**
            **/*.mp3
            **/*.wav
            **/*.mp4
            **/*.m4a
            **/*.mov
            **/*.mkv
          retention-days: 7

      - name: "Fail if verification flagged missing output"
        if: failure()
        run: |
          echo "Pipeline failed or verification step detected missing outputs. See uploaded artifacts and logs."
          exit 1
