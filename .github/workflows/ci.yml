name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test Python scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Make mock piper executable
        run: chmod +x tools/piper

      - name: Test mock piper
        run: |
          echo "Testing mock piper binary..."
          echo "test input" | ./tools/piper --output_file /tmp/test.wav
          ls -lh /tmp/test.wav
          file /tmp/test.wav

      - name: Setup ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Test TTS generation with mock piper
        env:
          PIPER_BINARY: ./tools/piper
          PIPER_MODEL_DIR: assets/piper
        run: |
          # Create a minimal test for the TTS generation module
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from tts_generate import find_piper_binary
          
          # Test that find_piper_binary works
          piper = find_piper_binary()
          print(f'Found piper binary at: {piper}')
          
          # Verify it's our mock
          assert 'tools/piper' in piper, f'Expected mock piper, got {piper}'
          print('✓ Piper binary detection working correctly')
          "

      - name: Validate imports
        run: |
          # Test that the main scripts can be imported without errors
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          
          print('Testing imports...')
          
          # Test tts_generate imports
          from tts_generate import (
              script_to_tts_chunks,
              tts_chunks_to_mp3,
              find_piper_binary
          )
          print('✓ tts_generate module imports successfully')
          
          # Test run_topic imports
          import run_topic
          print('✓ run_topic module imports successfully')
          
          print('All imports successful!')
          "

      - name: Test script parsing
        run: |
          # Test the script parsing functionality
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from tts_generate import script_to_tts_chunks
          
          # Test with a simple script
          test_script = '''
          A: Hello, this is speaker A.
          B: And this is speaker B responding.
          A: Great to be here with you.
          '''
          
          chunks = script_to_tts_chunks(test_script)
          print(f'Generated {len(chunks)} TTS chunks')
          
          # Verify we got expected chunks
          assert len(chunks) >= 3, f'Expected at least 3 chunks, got {len(chunks)}'
          assert chunks[0]['speaker'] == 'A', 'First chunk should be speaker A'
          assert chunks[1]['speaker'] == 'B', 'Second chunk should be speaker B'
          
          print('✓ Script parsing working correctly')
          "
