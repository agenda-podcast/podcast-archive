name: CI - smoke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.11"
      # Ensure repository root is on sys.path for module-style imports (recommended)
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar gzip unzip

      - name: Download latest rhasspy/piper release and install piper
        id: install_piper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/install_piper.py

      - name: Show installed piper
        run: |
          ls -l tools || true
          file tools/piper || true
        continue-on-error: true

      - name: Set PIPER_BINARY for job
        run: echo "PIPER_BINARY=./tools/piper" >> $GITHUB_ENV

      - name: Install Python requirements (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found; skipping pip install -r requirements.txt"
          fi

      - name: Run smoke test (verify piper detection)
        env:
          PIPER_BINARY: ./tools/piper
        run: |
          python - <<PY
import sys
try:
    from scripts.tts_generate import find_piper_binary
    p = find_piper_binary()
    print("Found piper at:", p)
except Exception as e:
    print("Smoke-check failed:", e, file=sys.stderr)
    sys.exit(2)
print("Smoke-check succeeded.")
PY

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            tools
            ./**/logs/**
