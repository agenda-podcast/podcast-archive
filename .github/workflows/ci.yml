name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test - Piper TTS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar
      
      - name: Download and install Piper TTS binary
        run: |
          set -euo pipefail
          
          echo "Fetching latest piper release from GitHub..."
          
          # Create tools directory
          mkdir -p tools
          
          # Download and install piper using Python
          python3 << 'PYTHON_SCRIPT'
          import json
          import urllib.request
          import tarfile
          import os
          import stat
          from pathlib import Path
          
          # Fetch latest release info
          url = "https://api.github.com/repos/rhasspy/piper/releases/latest"
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "ci-workflow"}
          
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              release_data = json.loads(response.read().decode())
          
          print(f"Latest release: {release_data.get('tag_name', 'unknown')}")
          
          # Find suitable asset (prefer linux x86_64 or amd64)
          assets = release_data.get("assets", [])
          selected_asset = None
          
          for asset in assets:
              name = asset.get("name", "").lower()
              # Look for linux x86_64 or amd64 archives
              if ("linux" in name and ("x86_64" in name or "amd64" in name)) and name.endswith(".tar.gz"):
                  selected_asset = asset
                  break
          
          if not selected_asset:
              raise RuntimeError("No suitable piper asset found for linux x86_64/amd64")
          
          asset_name = selected_asset["name"]
          download_url = selected_asset["browser_download_url"]
          
          print(f"Selected asset: {asset_name}")
          print(f"Download URL: {download_url}")
          
          # Download the asset
          download_path = f"/tmp/{asset_name}"
          print(f"Downloading to {download_path}...")
          
          req = urllib.request.Request(download_url, headers=headers)
          with urllib.request.urlopen(req, timeout=300) as response:
              with open(download_path, "wb") as f:
                  f.write(response.read())
          
          print(f"Downloaded {os.path.getsize(download_path)} bytes")
          
          # Extract the archive
          extract_dir = "/tmp/piper_extract"
          os.makedirs(extract_dir, exist_ok=True)
          
          print(f"Extracting to {extract_dir}...")
          with tarfile.open(download_path, "r:gz") as tar:
              tar.extractall(extract_dir)
          
          # Find the piper executable
          piper_binary = None
          for root, dirs, files in os.walk(extract_dir):
              for file in files:
                  if file == "piper":
                      candidate = os.path.join(root, file)
                      # Check if it's executable or can be made executable
                      piper_binary = candidate
                      break
              if piper_binary:
                  break
          
          if not piper_binary:
              raise RuntimeError("Could not find 'piper' executable in the extracted archive")
          
          print(f"Found piper binary at: {piper_binary}")
          
          # Copy to tools/piper and make executable
          dest = "tools/piper"
          import shutil
          shutil.copy2(piper_binary, dest)
          
          # Make executable
          st = os.stat(dest)
          os.chmod(dest, st.st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          
          print(f"Installed piper to {dest}")
          
          # Verify it's executable
          if os.access(dest, os.X_OK):
              print(f"✓ {dest} is executable")
          else:
              raise RuntimeError(f"{dest} is not executable")
          
          PYTHON_SCRIPT
      
      - name: Verify piper installation
        env:
          PIPER_BINARY: ./tools/piper
        run: |
          echo "Checking piper version..."
          ${PIPER_BINARY} --version || ${PIPER_BINARY} --help || echo "Piper binary installed"
          ls -lh ${PIPER_BINARY}
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping dependency installation"
          fi
      
      - name: Run smoke test - Import and validate piper detection
        env:
          PIPER_BINARY: ./tools/piper
        run: |
          python3 << 'PYTHON_TEST'
          import sys
          import os
          
          # Add scripts to path
          sys.path.insert(0, 'scripts')
          
          print("=" * 80)
          print("Smoke Test: Piper Binary Detection")
          print("=" * 80)
          
          # Test 1: Import the module
          print("\n1. Testing module import...")
          try:
              from tts_generate import find_piper_binary
              print("   ✓ Successfully imported find_piper_binary")
          except ImportError as e:
              print(f"   ✗ Failed to import: {e}")
              sys.exit(1)
          
          # Test 2: Detect piper binary
          print("\n2. Testing piper binary detection...")
          try:
              piper_path = find_piper_binary()
              print(f"   ✓ Found piper at: {piper_path}")
          except RuntimeError as e:
              print(f"   ✗ Failed to find piper: {e}")
              sys.exit(1)
          
          # Test 3: Verify PIPER_BINARY env var
          print("\n3. Verifying PIPER_BINARY environment variable...")
          expected = os.getenv("PIPER_BINARY")
          if expected:
              print(f"   PIPER_BINARY={expected}")
              if piper_path == os.path.abspath(expected):
                  print(f"   ✓ Detected path matches expected path")
              else:
                  print(f"   ! Detected path differs (resolved): {piper_path}")
          
          print("\n" + "=" * 80)
          print("✓ All smoke tests passed!")
          print("=" * 80)
          
          PYTHON_TEST
      
      - name: Upload piper binary as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piper-binary
          path: tools/piper
          if-no-files-found: error
      
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            /tmp/piper_extract
            tools/
          if-no-files-found: warn
