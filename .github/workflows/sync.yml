name: Sync Podcast

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-archive-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure folders exist
        run: mkdir -p data feed audio scripts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip requests feedparser

      - name: Run sync
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          POSTER_URL: ${{ secrets.POSTER_URL }}
        run: |
          python scripts/sync.py --download \
            ${PUBLIC_URL:+--public-url "$PUBLIC_URL"} \
            ${POSTER_URL:+--poster "$POSTER_URL"}

      - name: Commit changes
        run: |
          git config user.name "podcast-bot"
          git config user.email "bot@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: sync podcast metadata" || true
            git push
          else
            echo "No changes"
          fi
