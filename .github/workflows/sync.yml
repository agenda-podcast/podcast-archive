name: Sync Podcast

on:
  schedule:
    - cron: "0 * * * *"   # every hour (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-archive-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Ensure directories exist
        run: |
          mkdir -p data feed audio scripts
          if [ ! -f data/episodes.json ]; then
            cat > data/episodes.json <<'EOF'
{
  "channel": {
    "title": "Agenda Podcast",
    "link": "https://example.org/podcast",
    "description": "A simple podcast archive feed.",
    "language": "en-us",
    "lastBuildDate": "Thu, 01 Jan 1970 00:00:00 +0000",
    "copyright": "Agenda Podcast",
    "image": "",
    "itunes": {},
    "categories": []
  },
  "episodes": []
}
EOF
          fi

          if [ ! -f feed/rss.xml ]; then
            cat > feed/rss.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<rss version="2.0">
  <channel>
    <title>Agenda Podcast</title>
    <link>https://example.org/podcast</link>
    <description>A simple podcast archive feed.</description>
    <language>en-us</language>
    <lastBuildDate>Thu, 01 Jan 1970 00:00:00 +0000</lastBuildDate>
  </channel>
</rss>
EOF
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: python -m pip install --upgrade pip setuptools wheel requests feedparser

      - name: Run sync
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          POSTER_URL: ${{ secrets.POSTER_URL }}
        run: |
          python scripts/sync.py --download \
            ${PUBLIC_URL:+--public-url "$PUBLIC_URL"} \
            ${POSTER_URL:+--poster "$POSTER_URL"}

      - name: Commit changes (feed + data only)
        env:
          GIT_AUTHOR_NAME: podcast-bot
          GIT_AUTHOR_EMAIL: bot@github.com
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          if [ -n "$(git status --porcelain)" ]; then
            git add data feed
            git commit -m "chore: sync podcast metadata" || true
            git push
          else
            echo "No changes to commit"
          fi

      - name: Create release tag
        run: |
          echo "RELEASE_TAG=auto-archive-$(date -u +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Upload MP3s to release (if any)
        id: upload
        run: |
          COUNT=$(find audio -type f -name '*.mp3' 2>/dev/null | wc -l | tr -d ' ')
          echo "AUDIO_COUNT=$COUNT" >> $GITHUB_ENV
          echo "Found $COUNT mp3 files."

      - name: Create or update release and upload MP3s
        if: env.AUDIO_COUNT != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: audio/**/*.mp3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate feed XML
        run: |
          python3 - <<'PY'
          import sys, re, os
          import xml.etree.ElementTree as ET

          FEED = "feed/rss.xml"
          if not os.path.exists(FEED):
              print("ERROR: feed/rss.xml missing")
              sys.exit(1)

          try:
              tree = ET.parse(FEED)
              root = tree.getroot()
          except Exception as e:
              print("ERROR: feed/rss.xml is not well-formed:", e)
              sys.exit(2)

          txt = open(FEED, "r", encoding="utf-8").read()
          if re.search(r"buzzsprout", txt, re.I):
              print("ERROR: feed/rss.xml contains 'buzzsprout' references")
              sys.exit(3)

          print("OK: feed is well-formed and contains no buzzsprout references.")
          PY
